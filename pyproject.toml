[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nakedlunch"
version = "1.2"
authors = [
  { name = "Шамаев Илья Сергеевич (Yala, @yalayoloyellow)" }
]
description = ""
readme = "README.md"
license = { text = "Custom License — Personal Use Only" }
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
]

[project.scripts]
nakedlunch = "nakedlunch:main"

[tool.setuptools]
py-modules = ["nakedlunch"]
packages = ["core"]

[tool.setuptools.package-data]
"*" = ["assets/**/*", "data/**/*"]

[project.urls]
Homepage = "https://github.com/yalayoloyellow/nakedlunch"
Repository = "https://github.com/yalayoloyellow/nakedlunch"
# Releases + binaries + installers are attached to GitHub tags (v1.1+).
# pip install nakedlunch remains the easiest cross-platform way.
