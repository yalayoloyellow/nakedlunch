name: Release (GitHub + binaries)
permissions:
  contents: write
  actions: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            icon: assets/icon/nakedlunch.icns
            ext: ''
            artifact_name: nakedlunch-macos
          - os: windows-latest
            target: windows
            icon: assets/icon/nakedlunch.ico
            ext: .exe
            artifact_name: nakedlunch-windows.exe
          - os: ubuntu-latest
            target: linux
            icon: assets/icon/nakedlunch.png
            ext: ''
            artifact_name: nakedlunch-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build one-file binary (with icon)
        shell: bash
        run: |
          ICON_FLAG=""
          if [ -f "${{ matrix.icon }}" ]; then
            ICON_FLAG="--icon ${{ matrix.icon }}"
          fi
          TARGET_ARCH=""
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            TARGET_ARCH="--target-arch universal2"
          fi
          python -m PyInstaller --onefile --name ${{ matrix.artifact_name }} $ICON_FLAG $TARGET_ARCH --add-data "assets:assets" --clean nakedlunch.py

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Upload to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
          tag_name: ${{ github.ref_name }}
          name: nakedlunch ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          replace_existing_assets: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: also build sdist/wheel for PyPI (manual upload or trusted publisher later)
  sdist:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
          replace_existing_assets: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
