name: Release (GitHub + binaries)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            icon: assets/icon/nakedlunch.icns
            ext: ''
          - os: windows-latest
            target: windows
            icon: assets/icon/nakedlunch.ico
            ext: .exe
          - os: ubuntu-latest
            target: linux
            icon: assets/icon/nakedlunch.png
            ext: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build one-file binary (with icon)
        shell: bash
        run: python -m PyInstaller --onefile --name nakedlunch${{ matrix.ext }} --icon "${{ matrix.icon }}" --add-data "assets:assets" --clean nakedlunch.py

      - name: Prepare artifact name
        id: artifact
        run: |
          echo "name=nakedlunch-${{ matrix.target }}${{ matrix.ext }}" >> $GITHUB_OUTPUT

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/nakedlunch${{ matrix.ext }}

      - name: Upload to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nakedlunch${{ matrix.ext }}
          tag_name: ${{ github.ref_name }}
          name: nakedlunch ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: also build sdist/wheel for PyPI (manual upload or trusted publisher later)
  sdist:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
