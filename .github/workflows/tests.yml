# Тесты на каждое изменение.
#
# Артефактов корпуса на сборочной машине нет, поэтому часть тестов честно
# пропускается — с указанием, чего именно не хватает. Это не поблажка: те же
# тесты на машине с собранным индексом остаются строгими.

name: тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: прогон
        run: python -m pytest tests/ -q
