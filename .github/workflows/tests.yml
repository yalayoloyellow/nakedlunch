# Тесты на каждое изменение.
#
# Артефактов корпуса на сборочной машине нет, поэтому часть тестов честно
# пропускается — с указанием, чего именно не хватает. Это не поблажка: те же
# тесты на машине с собранным индексом остаются строгими.

name: тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # ТРИ СИСТЕМЫ, А НЕ ОДНА (Раунд 61). Выпускается три сборки, а тесты шли
    # только на macOS — значит ветки `os.name == "nt"` и XDG в core/пути.py не
    # исполнялись в CI никогда, как и путь к венву в core/дочерний.py, который
    # на Windows не существует по определению (.venv\Scripts, а не .venv/bin).
    #
    # fail-fast выключен намеренно: падение на новой системе — это сведения о
    # ней, а не повод отменять прогон на остальных.
    name: тесты · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: прогон
        run: python -m pytest tests/ -q
