# Сборка приложения под три системы.
#
# ПРИНЦИП: скачал, запустил, работает. Внутри артефакта всё, что нужно
# программе, — интерфейс, таблицы, акцентуатор. Ни питона, ни node, ни
# докачки на машине человека.
#
# Каждая система собирается на своей: кросс-компиляции для питона с нативным
# окном не существует. Отсюда матрица, а не один прогон.
#
# Модели акцентуатора на сборочной машине пустые: пакет тянет их при первом
# запуске. Забираем ровно те, к которым обращается код, — 21 МБ вместо 1.4 ГБ
# (см. tools/скачать_акцентуатор.py).

name: сборка

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Русский вывод не должен зависеть от кодировки консоли сборочной машины.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8" 

jobs:
  build:
    name: сборка · ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            id: macos
          - os: windows-latest
            id: windows
          - os: ubuntu-latest
            id: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: interface/react-app/package-lock.json

      - name: системные библиотеки (Linux)
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gir1.2-webkit2-4.1 \
                                  python3-gi python3-gi-cairo gir1.2-gtk-3.0

      - name: зависимости питона
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller ruaccent "transformers<5"

      - name: модели акцентуатора
        run: python tools/скачать_акцентуатор.py

      - name: интерфейс
        working-directory: interface/react-app
        run: |
          npm ci
          npm run build

      - name: сборка приложения
        run: pyinstaller --noconfirm nakedlunch.spec

      # --- упаковка под каждую систему ---------------------------------------
      - name: упаковка (macOS)
        if: matrix.id == 'macos'
        run: |
          hdiutil create -volname nakedlunch -srcfolder dist/nakedlunch.app \
                         -ov -format UDZO nakedlunch-macos.dmg

      - name: упаковка (Windows)
        if: matrix.id == 'windows'
        run: Compress-Archive -Path dist/nakedlunch/* -DestinationPath nakedlunch-windows.zip

      - name: упаковка (Linux)
        if: matrix.id == 'linux'
        run: tar -czf nakedlunch-linux.tar.gz -C dist nakedlunch

      # ЗАПУСК, А НЕ ПРОВЕРКА НАЛИЧИЯ ФАЙЛА (Раунд 61).
      #
      # Прежняя проверка смотрела только `test -x`, и в комментарии к ней было
      # написано, почему: «полноценно проверить работу на сборочной машине
      # нельзя — там нет ни корпуса, ни окна». Убеждение оказалось ложным:
      # РОЛЬ СЕРВЕРА ПОДНИМАЕТСЯ БЕЗ КОРПУСА И БЕЗ ОКНА, и `GET /` отдаёт
      # интерфейс — проверено на настоящем бандле 2026-08-12.
      #
      # Ценой этого убеждения стал релиз v2.1.0: он падал до открытия окна
      # (`stat()` по несуществующему в бандле пути) и не отдал бы фронт даже
      # после починки старта (`DIST` смотрел выше распакованных данных). Обе
      # ошибки ловились одним `curl`.
      #
      # Проверяем два пути: сервер поднимается и отдаёт интерфейс; разводка
      # ролей доходит до ЧУЖОЙ роли. Второе важно отдельно — в бандле роль
      # запускается командой «сам себя с именем роли», и этот путь не
      # проверялся ничем.
      #
      # Имена переменных оболочки — только ASCII: кириллические не присваиваются
      # и молча дают пустую строку (поймано на живой проверке 2026-08-12).
      - name: запуск собранного (macOS, Linux)
        if: matrix.id != 'windows'
        env:
          NAKEDLUNCH_HOME: ${{ runner.temp }}/nl-home
          NAKEDLUNCH_DATA: ${{ runner.temp }}/nl-data
        run: |
          set -u
          ./dist/nakedlunch/nakedlunch сервер --port 8899 > server.log 2>&1 &
          pid=$!
          code=""
          for i in $(seq 1 60); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8899/ || echo "")
            if [ "$code" = "200" ]; then break; fi
          done
          kill "$pid" 2>/dev/null || true
          echo "--- лог сервера ---"
          tail -40 server.log || true
          if [ "$code" != "200" ]; then
            echo "ОТКАЗ: собранный сервер не отдал 200 на / (получено: '$code')"
            exit 1
          fi
          echo "сервер поднялся и отдал интерфейс"
          ./dist/nakedlunch/nakedlunch индекс --check > index.log 2>&1 || true
          cat index.log
          if ! grep -q "индекс" index.log; then
            echo "ОТКАЗ: роль «индекс» не отработала — разводка ролей сломана"
            exit 1
          fi
          echo "разводка ролей работает"

      - name: запуск собранного (Windows)
        if: matrix.id == 'windows'
        shell: pwsh
        env:
          NAKEDLUNCH_HOME: ${{ runner.temp }}\nl-home
          NAKEDLUNCH_DATA: ${{ runner.temp }}\nl-data
        run: |
          $proc = Start-Process -FilePath "dist\nakedlunch\nakedlunch.exe" `
                                -ArgumentList "сервер","--port","8899" `
                                -PassThru -RedirectStandardOutput server.log `
                                -RedirectStandardError server.err
          $code = 0
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8899/" -UseBasicParsing -TimeoutSec 5
              $code = $r.StatusCode
            } catch { $code = 0 }
            if ($code -eq 200) { break }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "--- лог сервера ---"
          if (Test-Path server.log) { Get-Content server.log -Tail 40 }
          if (Test-Path server.err) { Get-Content server.err -Tail 40 }
          if ($code -ne 200) {
            Write-Host "ОТКАЗ: собранный сервер не отдал 200 на / (получено: $code)"
            exit 1
          }
          Write-Host "сервер поднялся и отдал интерфейс"
          $idx = (& "dist\nakedlunch\nakedlunch.exe" индекс --check 2>&1 | Out-String)
          $global:LASTEXITCODE = 0
          Write-Host $idx
          if ($idx -notmatch "индекс") {
            Write-Host "ОТКАЗ: роль «индекс» не отработала — разводка ролей сломана"
            exit 1
          }
          Write-Host "разводка ролей работает"

      - uses: actions/upload-artifact@v4
        with:
          name: nakedlunch-${{ matrix.id }}
          path: |
            nakedlunch-macos.dmg
            nakedlunch-windows.zip
            nakedlunch-linux.tar.gz
          if-no-files-found: ignore

  release:
    name: черновик релиза
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: false
