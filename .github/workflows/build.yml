# Переносимые релизные пакеты для каждой поддерживаемой платформы.
#
# Артефакт — onedir: macOS получает .app в DMG и ZIP, Windows — папку с .exe
# в ZIP, Linux — папку с исполняемым файлом в tar.gz. На машине пользователя
# не нужны Python, Node или исходники; личные данные никогда не кладутся сюда.

name: релизная сборка

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: сборка · ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-x64
            os: macos-13
            family: macos
          - id: macos-arm64
            os: macos-14
            family: macos
          - id: windows-x64
            os: windows-latest
            family: windows
          - id: linux-x64
            os: ubuntu-latest
            family: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: interface/react-app/package-lock.json

      - name: системные библиотеки Linux
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gir1.2-webkit2-4.1 \
                                  python3-gi python3-gi-cairo gir1.2-gtk-3.0

      - name: зависимости Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: офлайн-ресурсы акцентуатора
        run: python tools/скачать_акцентуатор.py

      # Тесты идут в том же полном окружении, что и пакет. Иначе динамическая
      # ветка звуковых ворот может не затронуть модель до сборки и сломаться
      # уже у человека.
      - name: тесты
        run: python -m pytest tests/ -q

      - name: интерфейс
        working-directory: interface/react-app
        run: |
          npm ci
          npm run build

      - name: сборка приложения
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          NAKEDLUNCH_VERSION="${version#v}" pyinstaller --clean --noconfirm nakedlunch.spec

      # Запускаем именно то, что будет вложено в архив. Профиль полностью
      # отдельный: проверка доказывает оба пользовательских корня, а не трогает
      # данные агента сборки.
      - name: запуск собранного macOS и Linux
        if: matrix.family != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.family }}" = "macos" ]; then
            bin="dist/nakedlunch.app/Contents/MacOS/nakedlunch"
            app_home="$RUNNER_TEMP/nl-profile/Library/Application Support/nakedlunch"
          else
            bin="dist/nakedlunch/nakedlunch"
            app_home="$RUNNER_TEMP/nl-profile/.local/share/nakedlunch"
          fi
          test -x "$bin"
          if find dist -name telegram.json -print -quit | grep -q .; then
            echo "ОТКАЗ: секрет Telegram попал в бандл"
            exit 1
          fi
          profile="$RUNNER_TEMP/nl-profile"
          mkdir -p "$profile"
          HOME="$profile" "$bin" сервер --host 127.0.0.1 --port 8899 > server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          code=""
          for i in $(seq 1 60); do
            sleep 1
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8899/ || true)
            [ "$code" = "200" ] && break
          done
          test "$code" = "200"
          curl -fsS http://127.0.0.1:8899/healthz | grep -qx "ok"
          curl -fsS http://127.0.0.1:8899/api/settings > settings.json
          curl -fsS http://127.0.0.1:8899/api/telegram/status > telegram-status.json
          curl -fsS http://127.0.0.1:8899/api/nl/state > corpus-status.json
          python -c 'import json; assert json.load(open("telegram-status.json"))["configured"] is False'
          test -d "$app_home/data"
          test -d "$profile/Documents/nakedlunch/data"
          if find "$profile" -name telegram.json -print -quit | grep -q .; then
            echo "ОТКАЗ: пустой запуск сам создал или перенёс Telegram-токен"
            exit 1
          fi
          echo "--- лог собранного сервера ---"
          tail -80 server.log

      - name: запуск собранного Windows
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "nl-profile"
          $env:HOME = $profile
          $env:USERPROFILE = $profile
          $env:APPDATA = Join-Path $profile "AppData\Roaming"
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          if (Get-ChildItem -Path dist -Filter telegram.json -Recurse -ErrorAction SilentlyContinue) {
            throw "ОТКАЗ: секрет Telegram попал в бандл"
          }
          $proc = Start-Process -FilePath "dist\nakedlunch\nakedlunch.exe" -ArgumentList @("сервер","--host","127.0.0.1","--port","8899") -PassThru -RedirectStandardOutput server.log -RedirectStandardError server.err
          try {
            $code = 0
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8899/" -UseBasicParsing -TimeoutSec 3
                $code = $response.StatusCode
              } catch { $code = 0 }
              if ($code -eq 200) { break }
            }
            if ($code -ne 200) { throw "ОТКАЗ: собранный сервер не отдал 200" }
            if ((Invoke-WebRequest -Uri "http://127.0.0.1:8899/healthz" -UseBasicParsing).Content.Trim() -ne "ok") {
              throw "ОТКАЗ: /healthz не ответил ok"
            }
            $status = Invoke-RestMethod -Uri "http://127.0.0.1:8899/api/telegram/status"
            if ($status.configured) { throw "ОТКАЗ: чистый пакет получил Telegram-токен" }
            Invoke-WebRequest -Uri "http://127.0.0.1:8899/api/settings" -UseBasicParsing | Out-Null
            Invoke-WebRequest -Uri "http://127.0.0.1:8899/api/nl/state" -UseBasicParsing | Out-Null
            if (!(Test-Path (Join-Path $env:APPDATA "nakedlunch\data"))) {
              throw "ОТКАЗ: нет пользовательского каталога настроек"
            }
            if (!(Test-Path (Join-Path $profile "Documents\nakedlunch\data"))) {
              throw "ОТКАЗ: программа не нашла Documents для корпуса"
            }
            if (Get-ChildItem -Path $profile -Filter telegram.json -Recurse -ErrorAction SilentlyContinue) {
              throw "ОТКАЗ: пустой запуск сам создал или перенёс Telegram-токен"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path server.log) { Get-Content server.log -Tail 80 }
          if (Test-Path server.err) { Get-Content server.err -Tail 80 }

      - name: пакет macOS
        if: matrix.family == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          codesign --force --deep --sign - dist/nakedlunch.app
          codesign --verify --deep --strict --verbose=2 dist/nakedlunch.app
          ditto -c -k --sequesterRsrc --keepParent dist/nakedlunch.app \
                "release/nakedlunch-${{ matrix.id }}.zip"
          hdiutil create -volname nakedlunch -srcfolder dist/nakedlunch.app \
                         -ov -format UDZO "release/nakedlunch-${{ matrix.id }}.dmg"

      - name: пакет Windows
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist\nakedlunch" -DestinationPath "release\nakedlunch-windows-x64.zip"

      - name: пакет Linux
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tar -czf release/nakedlunch-linux-x64.tar.gz -C dist nakedlunch
          if tar -tzf release/nakedlunch-linux-x64.tar.gz | grep -q 'telegram.json'; then
            echo "ОТКАЗ: секрет Telegram попал в архив"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nakedlunch-${{ matrix.id }}
          path: release/*
          if-no-files-found: error

  release:
    name: черновик релиза
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: false
